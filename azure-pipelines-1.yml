trigger:
- main

pool: myagentpool

variables:
  azureServiceConnectionId: 'myservicecon'
  webAppName: 'helloflasktesting'
  environmentName: 'helloflasktesting'
  projectRoot: '$(System.DefaultWorkingDirectory)'

stages:
- stage: Build
  displayName: Build FastAPI
  jobs:
  - job: BuildJob
    steps:
    - script: |
        set -e
        python3 -m pip install --upgrade pip
        python3 -m pip install -r requirements.txt

        echo "Checking dependency consistency..."
        python3 -m pip check || echo "WARNING: Dependency conflicts detected; review the log."

        echo "Checking FastAPI application..."
        python3 -c "import fastapi, uvicorn, jinja2, multipart, main; print('Application import successful')"

        test -f main.py
        test -f requirements.txt
        test -f templates/index.html
        test -f templates/hello.html
        test -d static
      workingDirectory: $(projectRoot)
      displayName: Install and validate dependencies

    - task: ArchiveFiles@2
      displayName: Package application
      inputs:
        rootFolderOrFile: '$(projectRoot)'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        replaceExistingArchive: true

    - script: |
        python3 -c "import zipfile, os; z=zipfile.ZipFile(os.environ['ZIP_PATH']); required=['main.py','requirements.txt','templates/index.html','templates/hello.html']; missing=[f for f in required if f not in z.namelist()]; print('Missing files:', missing); assert not missing, 'Package validation failed'; assert any(f.startswith('static/') and not f.endswith('/') for f in z.namelist()), 'No static assets in package'; print('Package validation passed')"
      displayName: Verify ZIP
      env:
        ZIP_PATH: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'

    - publish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
      artifact: drop
      displayName: Publish package

- stage: Deploy
  displayName: Deploy FastAPI
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeploymentJob
    pool: myAgentPool
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - task: AzureWebApp@1
            displayName: Deploy to Azure App Service
            inputs:
              azureSubscription: $(azureServiceConnectionId)
              appType: webAppLinux
              appName: $(webAppName)
              package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
              runtimeStack: 'PYTHON|3.10'
              startUpCommand: 'python -m uvicorn main:app --host 0.0.0.0 --port 8000'
              appSettings: '-SCM_DO_BUILD_DURING_DEPLOYMENT true'